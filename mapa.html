<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>🗺️ Onde posso pescar — Lisboa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1c2530}
  #topo{padding:.55em .9em;background:#0a7d5a;color:#fff;display:flex;align-items:center;gap:.7em;flex-wrap:wrap}
  #topo b{font-size:1.02rem}
  #topo a{color:#cdebe0;text-decoration:none;font-size:.88rem}
  #mapa{height:calc(100% - 122px);width:100%}
  #legenda{padding:.5em .9em;background:#f6f8f9;border-top:1px solid #e2e6ea;font-size:.85rem;line-height:2}
  #legenda label{margin-right:.9em;white-space:nowrap;cursor:pointer}
  .aviso{background:#fff8e6;border-left:3px solid #e6a817;padding:.45em .8em;font-size:.83rem;margin:0}
  @media(max-width:600px){#mapa{height:calc(100% - 150px)}}
</style>
</head>
<body>
<div id="topo">
  <b>🗺️ Onde posso pescar</b>
  <span style="opacity:.85;font-size:.85rem">Lisboa &amp; estuário</span>
  <a href="index.html#/MAR" style="margin-left:auto">← guia completo</a>
</div>
<p class="aviso">🔴 proibido (raio da regra) · 🟢 spot verificado · <b>auxiliar, não é a lei</b> — não mostra praias balneares nem placas. <b>Placa manda sempre.</b></p>
<div id="mapa"></div>
<div id="legenda">a carregar…</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var CORES={'pontão':'#e74c3c','doca/marina':'#c0392b','terminal fluvial':'#8e44ad','cais acostável':'#8e44ad','farol':'#d35400','unidade militar':'#7f8c8d','esgoto/ETAR ⚠️':'#16a085','estaleiro naval':'#2c3e50','aquicultura':'#16a085'};
var SPOTS=[
  ['Parque Ribeirinho Oriente (norte)',38.74735,-9.09692,'237 m do pontão · 30 min de bike'],
  ['Cais do Adamastor (PdN) — 100 m a norte',38.75905,-9.09079,'⚠️ o cais em si fica a 89 m de um pontão; este ponto está limpo'],
  ['Algés — 300 m a nascente do terminal',38.69140,-9.22611,'⚠️ o Dafundo fica dentro dos 300 m do terminal de Pedrouços'],
  ['Rio Judeu — 100 m do pontão',38.62576,-9.10929,'⚠️ não pescar EM CIMA do pontão (100 m)'],
  ['Cavaquinhas — 100 m do pontão',38.63274,-9.10549,'⚠️ idem: afastar-se do pontão'],
  ['Trafaria — 150 m a SO da estação',38.67313,-9.23429,'⚠️ a estação fluvial obriga a 300 m'],
  ['Porto Brandão — 200 m a sul',38.67506,-9.20660,'⚠️ a estação fluvial obriga a 300 m'],
  ['Montijo — 300 m a NE do cais',38.70481,-8.97996,'⚠️ o Cais dos Pescadores é cais acostável (300 m)'],
  ['Alcochete — 250 m a NE do ponte-cais',38.75773,-8.96307,'⚠️ o ponte-cais e um farol obrigam a 100 m'],
  ['Cais de Alhos Vedros (Moita)',38.66190,-9.02310,'limpo'],
  ['Praia da Adiça',38.55830,-9.19010,'praia oceânica · 1599 m da Fonte da Telha'],
  ['Setúbal — frente ao jardim',38.52040,-8.89420,'🏆 autorização ESCRITA no edital de Setúbal']
];
var mapa=L.map('mapa').setView([38.72,-9.13],12);
var MAPA_REF=mapa, CAMADAS_REF={}, LEGENDA_ID='legenda';
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(mapa);
SPOTS.forEach(function(s){
  L.circleMarker([s[1],s[2]],{radius:8,color:'#0a7d5a',fillColor:'#27ae60',fillOpacity:.92,weight:2})
   .addTo(mapa).bindPopup('<b>🎣 '+s[0]+'</b><br>'+s[3]);
});
fetch('data-zonas.json').then(function(r){return r.json();}).then(function(zs){
  var cam={};
  zs.forEach(function(z){
    var cor=CORES[z.t]||'#e74c3c';
    var c=L.circle([z.la,z.lo],{radius:z.r,color:cor,fillColor:cor,fillOpacity:.13,weight:1})
      .bindPopup('<b>⛔ '+z.t+'</b>'+(z.n?'<br>'+z.n:'')+'<br>proibido a menos de <b>'+z.r+' m</b>'+(z.nac?'<br><small>🇵🇹 <b>proibição NACIONAL</b> (Portaria 14/2014, art. 8.º)</small>':'<br><small>📍 regra do <b>edital da Capitania de Lisboa</b></small>'));
    (cam[z.t]=cam[z.t]||L.layerGroup()).addLayer(c);
  });
  Object.keys(cam).forEach(function(k){cam[k].addTo(mapa);});
  var leg=document.getElementById('legenda');
  leg.innerHTML=Object.keys(cam).map(function(k){
    return '<label><input type="checkbox" checked data-c="'+k+'"> <span style="color:'+(CORES[k]||'#e74c3c')+'">■</span> '+k+' ('+zs.filter(function(x){return x.t===k;}).length+')</label>';
  }).join('')+'<label><span style="color:#27ae60">●</span> spots verificados ('+SPOTS.length+')</label>';
  leg.querySelectorAll('input[data-c]').forEach(function(cb){
    cb.onchange=function(){var k=cb.getAttribute('data-c'); cb.checked?cam[k].addTo(mapa):mapa.removeLayer(cam[k]);};
  });
}).catch(function(){document.getElementById('legenda').textContent='⚠️ não deu para carregar as zonas.';});

    // camada das praias balneares (só proibidas dentro da época)
    fetch('data-praias.json').then(function(r){return r.json();}).then(function(ps){
      var g=L.layerGroup(), hoje=new Date(), ano=hoje.getFullYear(), ativas=0;
      ps.forEach(function(p){
        var ini=new Date(ano+'-'+p.i+'T00:00:00'), fim=new Date(ano+'-'+p.f+'T23:59:59');
        var dentro = hoje>=ini && hoje<=fim;
        if(dentro) ativas++;
        var cor = dentro ? '#e67e22' : '#95a5a6';
        L.circle([p.la,p.lo],{radius:p.r,color:cor,fillColor:cor,fillOpacity:dentro?0.18:0.05,weight:dentro?2:1,dashArray:dentro?null:'4'})
         .bindPopup('<b>🏖️ '+p.n+'</b><br>época: '+p.i.split('-').reverse().join('/')+' a '+p.f.split('-').reverse().join('/')+
           '<br>capitania: '+p.j+' · raio <b>'+p.r+' m</b><br><b>'+(dentro?'⛔ PROIBIDO agora':'✅ fora de época')+'</b>').addTo(g);
      });
      g.addTo(MAPA_REF);
      CAMADAS_REF['praia balnear'] = g;
      var leg=document.getElementById(LEGENDA_ID);
      if(leg) leg.insertAdjacentHTML('beforeend',
        '<label style="margin-right:.9em;white-space:nowrap;cursor:pointer"><input type="checkbox" checked data-c="praia balnear"> '+
        '<span style="color:#e67e22">■</span> praias balneares ('+ativas+' em época de '+ps.length+')</label>');
      if(leg){ var cb=leg.querySelector('input[data-c="praia balnear"]');
        if(cb) cb.onchange=function(){ cb.checked?g.addTo(MAPA_REF):MAPA_REF.removeLayer(g); }; }
    }).catch(function(){});


    // camada ICNF — aguas interiores (dados oficiais: ZPR, ZPP, concessoes)
    fetch('data-icnf.json').then(function(r){return r.json();}).then(function(gj){
      var grupos={};
      L.geoJSON(gj,{
        style:function(f){return {color:f.properties.cor,weight:3,opacity:.75};},
        onEachFeature:function(f,l){
          var p=f.properties;
          l.bindPopup('<b>'+p.tipo+'</b><br>'+(p.nome?'<b>'+p.nome+'</b><br>':'')+
            (p.rio?'rio: '+p.rio+'<br>':'')+(p.ent?'gestor: '+p.ent+'<br>':'')+
            (p.dip?'<i>'+p.dip+'</i><br>':'')+
            (p.mont?'<small>montante: '+p.mont+'</small><br>':'')+
            (p.jus?'<small>jusante: '+p.jus+'</small><br>':'')+
            '<small style="opacity:.7">fonte: ICNF (oficial)</small>');
          (grupos[p.tipo]=grupos[p.tipo]||L.layerGroup()).addLayer(l);
        }
      });
      var leg=document.getElementById(LEGENDA_ID);
      Object.keys(grupos).forEach(function(k){
        var cor=(k.indexOf('Reservada')>=0?'#c0392b':k.indexOf('Profissional')>=0?'#8e44ad':'#e67e22');
        var n=gj.features.filter(function(f){return f.properties.tipo===k;}).length;
        if(leg) leg.insertAdjacentHTML('beforeend',
          '<label style="margin-right:.9em;white-space:nowrap;cursor:pointer"><input type="checkbox" data-c="'+k+'"> '+
          '<span style="color:'+cor+'">━</span> '+k+' ('+n+')</label>');
        var cb=leg&&leg.querySelector('input[data-c="'+k+'"]');
        if(cb) cb.onchange=function(){ cb.checked?grupos[k].addTo(MAPA_REF):MAPA_REF.removeLayer(grupos[k]); };
      });
      if(leg) leg.insertAdjacentHTML('beforeend','<div style="opacity:.65;font-size:.9em;margin-top:.3em">🏞️ as camadas do ICNF (águas interiores/rios) vêm desligadas — liga para veres.</div>');
    }).catch(function(){});

// localizar-me
L.control.locate=null;
var btn=L.control({position:'topleft'});
btn.onAdd=function(){var d=L.DomUtil.create('div','leaflet-bar');
  d.innerHTML='<a href="#" title="Onde estou" style="font-size:18px;text-align:center;line-height:26px">📍</a>';
  d.onclick=function(e){e.preventDefault();
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){
      var ll=[p.coords.latitude,p.coords.longitude];
      mapa.setView(ll,16);
      L.circleMarker(ll,{radius:9,color:'#2980b9',fillColor:'#3498db',fillOpacity:.9}).addTo(mapa).bindPopup('📍 Estás aqui').openPopup();
    });
    return false;};
  return d;};
btn.addTo(mapa);
</script>
</body>
</html>
